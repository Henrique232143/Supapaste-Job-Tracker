{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Job Tracker — cadastre uma nova candidatura."
    >

    <title>Job Tracker | Nova candidatura</title>

    <link
        rel="stylesheet"
        href="{% static 'cadastro/nova_candidatura.css' %}"
    >

</head>

<body>

    <main class="form-page">

        <div class="form-container">

            <!-- VOLTAR -->
            <a
                href="{% url 'candidaturas' %}"
                class="back-link"
            >
                ← Voltar para candidaturas
            </a>


            <!-- CARD -->
            <section class="form-card">

                <!-- CABEÇALHO -->
                <div class="form-header">

                    <span class="page-eyebrow">
                        NOVA CANDIDATURA
                    </span>

                    <h1>
                        Adicionar oportunidade
                    </h1>

                    <p>
                        Registre uma nova vaga e acompanhe todo o
                        processo seletivo pelo Job Tracker.
                    </p>

                </div>


                <!-- FORMULÁRIO -->
                <form
                    method="post"
                    class="candidatura-form"
                >

                    {% csrf_token %}


                    <!-- CAMPOS -->
                    <div class="form-fields">

                        {{ form.as_p }}

                    </div>


                    <!-- AÇÕES -->
                    <div class="form-actions">

                        <a
                            href="{% url 'candidaturas' %}"
                            class="btn-secondary"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn-primary"
                        >
                            Salvar candidatura →
                        </button>

                    </div>

                </form>

            </section>


            <!-- RODAPÉ -->
            <p class="form-footer">
                Job Tracker · Organize sua busca. Acompanhe sua evolução.
            </p>

        </div>

    </main>

</body>

</html>
